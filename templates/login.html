{% extends "base.html" %}
{% load static %}

{% block title %}Login - Expense Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome Back! 👋</h1>
            <p>Sign in to your ExpenseTracker account</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <input type="text" id="username" name="username" required placeholder=" " autofocus>
                <label for="username">Username</label>
            </div>

            <div class="form-group password-group">
                <input type="password" id="password" name="password" required placeholder=" ">
                <label for="password">Password</label>
                <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="cursor:pointer">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'register' %}">Sign up here</a></p>
        </div>
    </div>
</div>

<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .auth-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        animation: slideUp 0.5s ease-out;
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .auth-header h1 {
        color: #2c3e50;
        margin-bottom: 10px;
    }
    
    .auth-header p {
        color: #7f8c8d;
    }
    
    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        position: relative;
        margin-bottom: 22px;
    }
    
    .form-group input {
        width: 100%;
        padding: 16px 15px;
        border: 2px solid #ecf0f1;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        transition: border-color 0.3s, box-shadow 0.3s;
        background: white;
    }
    
    .form-group label {
        position: absolute;
        left: 15px;
        top: 16px;
        color: #aaa;
        font-size: 16px;
        pointer-events: none;
        transition: 0.2s ease all;
        background: white;
        padding: 0 5px;
    }
    
    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
        top: -8px;
        left: 12px;
        font-size: 12px;
        color: #667eea;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.25);
    }
    
    .password-group input {
        padding-right: 48px;
    }
    
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #667eea;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
    }
    
    .password-toggle:focus {
        outline: none;
    }
    
    .password-toggle:hover {
        color: #4753d6;
    }
    
    .btn-block {
        width: 100%;
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 25px;
        color: #7f8c8d;
    }
    
    .auth-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }
    
    .auth-footer a:hover {
        text-decoration: underline;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
