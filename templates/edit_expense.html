{% extends "base.html" %}
{% load static %}

{% block title %}Edit Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1>✏️ Edit Expense</h1>
        <p class="form-subtitle">Update your expense transaction</p>

        <form method="POST" enctype="multipart/form-data" class="transaction-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id == expense.category_id %}selected{% endif %}>{{ cat.emoji }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00" min="0" value="{{ expense.amount }}">
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method">
                    <option value="Cash" {% if expense.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
                    <option value="Credit Card" {% if expense.payment_method == 'Credit Card' %}selected{% endif %}>Credit Card</option>
                    <option value="Debit Card" {% if expense.payment_method == 'Debit Card' %}selected{% endif %}>Debit Card</option>
                    <option value="Bank Transfer" {% if expense.payment_method == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
                    <option value="Digital Wallet" {% if expense.payment_method == 'Digital Wallet' %}selected{% endif %}>Digital Wallet</option>
                    <option value="Check" {% if expense.payment_method == 'Check' %}selected{% endif %}>Check</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required value="{{ expense.date|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Add a note (optional)" rows="4">{{ expense.description }}</textarea>
            </div>

            <div class="form-group">
                <label for="receipt_image">Receipt Image (optional)</label>
                {% if expense.receipt_image %}
                    <p>Current image: <a href="{{ expense.receipt_image.url }}" target="_blank">View</a></p>
                {% endif %}
                <input type="file" id="receipt_image" name="receipt_image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block">✓ Update Expense</button>
            <a href="{% url 'transactions' %}" class="btn btn-secondary btn-block">← Back</a>
        </form>
    </div>
</div>
{% endblock %}
