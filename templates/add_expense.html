{% extends "base.html" %}
{% load static %}

{% block title %}Add Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1>💳 Add Expense</h1>
        <p class="form-subtitle">Record a new expense transaction</p>

        <form method="POST" enctype="multipart/form-data" class="transaction-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.emoji }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00" min="0">
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method">
                    <option value="Cash">Cash</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Digital Wallet">Digital Wallet</option>
                    <option value="Check">Check</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required value="{{ today }}">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Add a note (optional)" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="receipt_image">Receipt Image (optional)</label>
                <input type="file" id="receipt_image" name="receipt_image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-block">✓ Add Expense</button>
            <a href="{% url 'home' %}" class="btn btn-secondary btn-block">← Back</a>
        </form>
    </div>
</div>
{% endblock %}
